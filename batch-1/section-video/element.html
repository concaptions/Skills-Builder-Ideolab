<!--
  Video section.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  Click to load, done without script. The poster is a link to a fragment, and
  the iframe only exists inside a container that is revealed by :target. Until
  the visitor presses play, no third party embed is on the page at all, which
  keeps the page fast and stops the video host setting cookies on people who
  never watched anything.

  The iframe src below is a placeholder. Replace it with the real embed URL.
  Prefer the host's privacy mode where one exists.

  Default configuration shown here:
    single 16:9 player, centred, poster with a play control, caption beneath.

  Every id and class in this block is prefixed vid- so it cannot collide with
  the rest of the page. Placing this block twice on one page requires changing
  that prefix, because the play state relies on an id.
-->
<section class="vid vid-bg-surface px-5 py-20 vid-text-ink sm:px-8 lg:py-28" aria-labelledby="vid-title">

  <style>
    @layer ideolab-fallback {
      /* Taken from Tailwind itself, so it cannot drift from what the
         classes mean. It sits in a layer, so a page that loads its own
         Tailwind overrides all of it; a page with none renders from this. */
      .vid, .vid *, .vid::before, .vid *::before, .vid::after, .vid *::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: ;}
      .vid, .vid *, .vid::after, .vid *::after, .vid::before, .vid *::before{box-sizing:border-box;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;border-top-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-style:solid;border-top-color:rgb(229, 231, 235);border-right-color:rgb(229, 231, 235);border-bottom-color:rgb(229, 231, 235);border-left-color:rgb(229, 231, 235);}
      .vid::after, .vid *::after, .vid::before, .vid *::before{--tw-content:'';}
      .vid{line-height:1.5;text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
      .vid h1, .vid h2, .vid h3, .vid h4, .vid h5, .vid h6{font-size:inherit;font-weight:inherit;}
      .vid a{color:inherit;text-decoration-line:inherit;text-decoration-thickness:inherit;text-decoration-style:inherit;text-decoration-color:inherit;}
      .vid blockquote, .vid dd, .vid dl, .vid figure, .vid h1, .vid h2, .vid h3, .vid h4, .vid h5, .vid h6, .vid hr, .vid p, .vid pre{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;}
      .vid audio, .vid canvas, .vid embed, .vid iframe, .vid img, .vid object, .vid svg, .vid video{display:block;vertical-align:middle;}
      .vid.absolute, .vid .absolute{position:absolute;}
      .vid.inset-0, .vid .inset-0{top:0px;right:0px;bottom:0px;left:0px;}
      .vid.mx-auto, .vid .mx-auto{margin-left:auto;margin-right:auto;}
      .vid.mb-10, .vid .mb-10{margin-bottom:2.5rem;}
      .vid.mb-3, .vid .mb-3{margin-bottom:0.75rem;}
      .vid.ml-1, .vid .ml-1{margin-left:0.25rem;}
      .vid.mt-4, .vid .mt-4{margin-top:1rem;}
      .vid.block, .vid .block{display:block;}
      .vid.grid, .vid .grid{display:grid;}
      .vid.aspect-video, .vid .aspect-video{aspect-ratio:16 / 9;}
      .vid.h-20, .vid .h-20{height:5rem;}
      .vid.h-8, .vid .h-8{height:2rem;}
      .vid.w-20, .vid .w-20{width:5rem;}
      .vid.w-8, .vid .w-8{width:2rem;}
      .vid.w-full, .vid .w-full{width:100%;}
      .vid.max-w-2xl, .vid .max-w-2xl{max-width:42rem;}
      .vid.max-w-4xl, .vid .max-w-4xl{max-width:56rem;}
      .vid.place-items-center, .vid .place-items-center{align-items:center;justify-items:center;}
      .vid.rounded-full, .vid .rounded-full{border-top-left-radius:9999px;border-top-right-radius:9999px;border-bottom-right-radius:9999px;border-bottom-left-radius:9999px;}
      .vid.border, .vid .border{border-top-width:1px;border-right-width:1px;border-bottom-width:1px;border-left-width:1px;}
      .vid.border-black\/10, .vid .border-black\/10{border-top-color:rgba(0, 0, 0, 0.1);border-right-color:rgba(0, 0, 0, 0.1);border-bottom-color:rgba(0, 0, 0, 0.1);border-left-color:rgba(0, 0, 0, 0.1);}
      .vid.bg-white\/95, .vid .bg-white\/95{background-color:rgba(255, 255, 255, 0.95);}
      .vid.px-5, .vid .px-5{padding-left:1.25rem;padding-right:1.25rem;}
      .vid.py-20, .vid .py-20{padding-top:5rem;padding-bottom:5rem;}
      .vid.text-center, .vid .text-center{text-align:center;}
      .vid.text-4xl, .vid .text-4xl{font-size:2.25rem;line-height:2.5rem;}
      .vid.text-base, .vid .text-base{font-size:1rem;line-height:1.5rem;}
      .vid.text-xs, .vid .text-xs{font-size:0.75rem;line-height:1rem;}
      .vid.text-sm, .vid .text-sm{font-size:0.875rem;line-height:1.25rem;}
      .vid.font-semibold, .vid .font-semibold{font-weight:600;}
      .vid.uppercase, .vid .uppercase{text-transform:uppercase;}
      .vid.leading-relaxed, .vid .leading-relaxed{line-height:1.625;}
      .vid.leading-tight, .vid .leading-tight{line-height:1.25;}
      .vid.tracking-\[0\.2em\], .vid .tracking-\[0\.2em\]{letter-spacing:0.2em;}
      .vid.shadow-xl, .vid .shadow-xl{--tw-shadow:0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);box-shadow:var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);}
      @media (min-width: 640px){.vid.sm\:px-8, .vid .sm\:px-8{padding-left:2rem;padding-right:2rem;}.vid.sm\:text-5xl, .vid .sm\:text-5xl{font-size:3rem;line-height:1;}}
      @media (min-width: 1024px){.vid.lg\:py-28, .vid .lg\:py-28{padding-top:7rem;padding-bottom:7rem;}}
    }

    
    
    
    /* Colour lives here, not in theme class names. Each page the builder
       makes declares its own colour names, so a name borrowed from one page
       resolves to nothing on the next. Rebrand the block by changing these
       six values. They are channel triplets so an opacity suffix works. */
    .vid{
      --vid-surface:255 255 255;  /* card and panel faces */
      --vid-band:246 247 249;  /* the quiet band behind content */
      --vid-ink:15 23 42;  /* headings and primary copy */
      --vid-soft:92 107 129;  /* supporting copy */
      --vid-accent:37 99 235;  /* the one emphasis colour */
      --vid-deep:11 18 32;  /* the dark ground */
    }
    .vid.vid-bg-deep, .vid .vid-bg-deep{background-color:rgb(var(--vid-deep))}
    .vid.vid-bg-surface, .vid .vid-bg-surface{background-color:rgb(var(--vid-surface))}
    .vid.vid-text-accent, .vid .vid-text-accent{color:rgb(var(--vid-accent))}
    .vid.vid-text-ink, .vid .vid-text-ink{color:rgb(var(--vid-ink))}
    .vid.vid-text-soft, .vid .vid-text-soft{color:rgb(var(--vid-soft))}

    .vid .vid-frame{position:relative;overflow:hidden;border-radius:1.5rem}

    /* The embed is absent until the fragment matches. */
    .vid .vid-player{display:none}
    .vid #vid-play:target .vid-player{display:block}
    .vid #vid-play:target .vid-poster{display:none}

    .vid .vid-poster{position:relative;display:block;width:100%}
    .vid .vid-poster:focus-visible{outline:3px solid rgb(37 99 235);outline-offset:3px;border-radius:1.5rem}

    .vid .vid-btn{transition:transform 220ms cubic-bezier(.16,1,.3,1)}
    .vid .vid-poster:hover .vid-btn{transform:scale(1.08)}

    @media (prefers-reduced-motion: reduce){
      .vid .vid-btn{transition:none}
      .vid .vid-poster:hover .vid-btn{transform:none}
    }
      .vid.vid-art, .vid .vid-art{background-image:linear-gradient(to bottom right,rgb(var(--vid-accent)/.30),rgb(var(--vid-accent)/.10),transparent)}
</style>

  <div class="mx-auto max-w-4xl">

    <header class="mx-auto mb-10 max-w-2xl text-center">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] vid-text-accent">Watch</p>
      <h2 id="vid-title" class="text-4xl font-semibold leading-tight sm:text-5xl">Two minutes inside a finished job</h2>
      <p class="mt-4 text-base leading-relaxed vid-text-soft">A walk through of a wet room from first fix to handover, filmed on the day.</p>
    </header>

    <div id="vid-play" class="vid-frame border border-black/10 vid-bg-deep">

      <a href="#vid-play" class="vid-poster group" aria-label="Play the video, two minutes inside a finished job">
        <span class="block aspect-video w-full vid-art"></span>
        <span class="absolute inset-0 grid place-items-center">
          <span class="vid-btn grid h-20 w-20 place-items-center rounded-full bg-white/95 shadow-xl" aria-hidden="true">
            <svg width="32" height="32" class="ml-1 h-8 w-8 vid-text-ink" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </span>
      </a>

      <div class="vid-player">
        <iframe class="aspect-video w-full" src="about:blank"
          title="Two minutes inside a finished job"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen loading="lazy"></iframe>
      </div>

    </div>

    <p class="mt-4 text-center text-sm vid-text-soft">Filmed at a job in Ashfield Road. Nothing staged and nothing tidied for the camera.</p>

  </div>
</section>
