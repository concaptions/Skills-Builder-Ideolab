<!--
  Photo Gallery section.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  Default configuration shown here:
    layout 3 column grid, square crop, category filters on, captions hidden,
    hover zoom inside a fixed frame, staggered entrance.

  Every id and class in this block is prefixed pgal- so it cannot collide with
  the rest of the page. Placing this block twice on one page requires changing
  that prefix, because the filters rely on ids.
-->

    /* Colour lives here, not in theme class names. Each page the builder
       makes declares its own colour names, so a name borrowed from one page
       resolves to nothing on the next. Rebrand the block by changing these
       six values. They are channel triplets so an opacity suffix works. */
    .pgal{
      --pgal-surface:255 255 255;  /* card and panel faces */
      --pgal-band:246 247 249;  /* the quiet band behind content */
      --pgal-ink:15 23 42;  /* headings and primary copy */
      --pgal-soft:92 107 129;  /* supporting copy */
      --pgal-accent:37 99 235;  /* the one emphasis colour */
      --pgal-deep:11 18 32;  /* the dark ground */
    }
    .pgal.pgal-bg-surface, .pgal .pgal-bg-surface{background-color:rgb(var(--pgal-surface))}
    .pgal.pgal-text-accent, .pgal .pgal-text-accent{color:rgb(var(--pgal-accent))}
    .pgal.pgal-text-ink, .pgal .pgal-text-ink{color:rgb(var(--pgal-ink))}
    .pgal.pgal-text-soft, .pgal .pgal-text-soft{color:rgb(var(--pgal-soft))}

    /* Filter radios drive the grid. They are never shown. */
    .pgal input[name="pgal-filter"]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* Chip styling, and the selected state driven by the radio next to it. */
    .pgal .pgal-chip{cursor:pointer;user-select:none}
    .pgal input[name="pgal-filter"]:checked + .pgal-chip{
      background:rgb(var(--pgal-accent));border-color:rgb(var(--pgal-accent));color:rgb(var(--pgal-surface))}
    .pgal input[name="pgal-filter"]:focus-visible + .pgal-chip{outline:2px solid currentColor;outline-offset:2px}

    /* Filtering. Each radio hides the items that do not match it. */
    .pgal #pgal-f-bathrooms:checked ~ .pgal-grid > li:not([data-cat="bathrooms"]),
    .pgal #pgal-f-heating:checked   ~ .pgal-grid > li:not([data-cat="heating"]),
    .pgal #pgal-f-kitchens:checked  ~ .pgal-grid > li:not([data-cat="kitchens"]){display:none}

    /* Entrance. Pure CSS, so it needs no observer and no script. */
    .pgal .pgal-rise{animation:pgal-rise 420ms cubic-bezier(.16,1,.3,1) both}
    @keyframes pgal-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* The frame never resizes, so a hover cannot push the grid around. */
    .pgal .pgal-shot{transition:transform 320ms cubic-bezier(.16,1,.3,1)}
    .pgal .pgal-tile:hover .pgal-shot,
    .pgal .pgal-tile:focus-visible .pgal-shot{transform:scale(1.05)}

    @media (prefers-reduced-motion: reduce){
      .pgal .pgal-rise{animation:none}
      .pgal .pgal-shot{transition:none}
      .pgal .pgal-tile:hover .pgal-shot{transform:none}
    }
  </style>
