<!--
  Testimonials section.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  Nothing rotates. A carousel needs a script, and a testimonial that slides
  away as the reader starts reading it is worse than one they never saw.

  Every quote is a blockquote with a cite, so the words and the person are
  connected. Ratings are written in text as well as drawn, because five shapes
  are silence to a screen reader.

  Replace these with real customers. Three real ones beat six invented ones.

  Default configuration shown here:
    three cards, ratings with the figure in text, names and places,
    staggered entrance.

  Every class is prefixed sts- so it cannot collide with the rest of the page.
-->
<section class="sts px-5 py-16 sm:px-8" aria-labelledby="sts-title">

  <style>
    
    @layer sts-base {
      .sts,.sts *,.sts *::before,.sts *::after{box-sizing:border-box}
      .sts{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
      .sts h2,.sts p,.sts blockquote,.sts figure,.sts figcaption{margin:0}
      .sts ul,.sts ol{margin:0;padding:0;list-style:none}
      .sts svg{display:block;max-width:100%}
      .sts{background-color:rgb(var(--sts-surface));color:rgb(var(--sts-ink));padding:4rem 1.25rem}
      .sts .sts-wrap{max-width:64rem;margin-inline:auto}
      .sts .sts-row{display:grid;gap:1.25rem}
      .sts h2{font-size:1.875rem;font-weight:600}
      .sts p,.sts blockquote{font-size:1rem;line-height:1.625}
    }

    .sts{
      --sts-surface:255 255 255;
      --sts-band:246 247 249;
      --sts-ink:15 23 42;
      --sts-soft:92 107 129;
      --sts-accent:37 99 235;
      --sts-deep:11 18 32;
      background-color:rgb(var(--sts-surface));
      color:rgb(var(--sts-ink));
    }
    .sts .sts-soft{color:rgb(var(--sts-soft))}

    .sts .sts-card{
      display:flex;flex-direction:column;height:100%;
      border:1px solid rgb(var(--sts-ink)/.10);border-radius:1.25rem;padding:1.5rem;
      background-color:rgb(var(--sts-band));
      transition:transform 240ms cubic-bezier(.16,1,.3,1),box-shadow 240ms ease;
      animation:sts-rise 420ms cubic-bezier(.16,1,.3,1) both;
    }
    .sts .sts-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgb(15 23 42 / .08)}
    @keyframes sts-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    .sts .sts-stars{color:rgb(var(--sts-accent));display:flex;gap:.12rem}
    .sts .sts-attrib{margin-top:auto;padding-top:1.25rem}
    .sts cite{font-style:normal}

    @media (min-width: 640px){ .sts .sts-row{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (min-width: 1024px){ .sts .sts-row{grid-template-columns:repeat(3,minmax(0,1fr))} }

    @media (prefers-reduced-motion: reduce){
      .sts .sts-card{animation:none;transition:none}
      .sts .sts-card:hover{transform:none;box-shadow:none}
    }
  
    @layer ideolab-fallback {
      /* Taken from Tailwind itself, so it cannot drift from what the
         classes mean. It sits in a layer, so a page that loads its own
         Tailwind overrides all of it; a page with none renders from this. */
      .sts, .sts *, .sts::before, .sts *::before, .sts::after, .sts *::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: ;}
      .sts, .sts *, .sts::after, .sts *::after, .sts::before, .sts *::before{box-sizing:border-box;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;border-top-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-style:solid;border-top-color:rgb(229, 231, 235);border-right-color:rgb(229, 231, 235);border-bottom-color:rgb(229, 231, 235);border-left-color:rgb(229, 231, 235);}
      .sts::after, .sts *::after, .sts::before, .sts *::before{--tw-content:'';}
      .sts{line-height:1.5;text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
      .sts h1, .sts h2, .sts h3, .sts h4, .sts h5, .sts h6{font-size:inherit;font-weight:inherit;}
      .sts blockquote, .sts dd, .sts dl, .sts figure, .sts h1, .sts h2, .sts h3, .sts h4, .sts h5, .sts h6, .sts hr, .sts p, .sts pre{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;}
      .sts menu, .sts ol, .sts ul{list-style-position:initial;list-style-image:initial;list-style-type:none;margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;}
      .sts audio, .sts canvas, .sts embed, .sts iframe, .sts img, .sts object, .sts svg, .sts video{display:block;vertical-align:middle;}
      .sts.mx-auto, .sts .mx-auto{margin-left:auto;margin-right:auto;}
      .sts.mb-8, .sts .mb-8{margin-bottom:2rem;}
      .sts.mt-3, .sts .mt-3{margin-top:0.75rem;}
      .sts.block, .sts .block{display:block;}
      .sts.flex, .sts .flex{display:flex;}
      .sts.grid, .sts .grid{display:grid;}
      .sts.h-4, .sts .h-4{height:1rem;}
      .sts.w-4, .sts .w-4{width:1rem;}
      .sts.max-w-4xl, .sts .max-w-4xl{max-width:56rem;}
      .sts.items-center, .sts .items-center{align-items:center;}
      .sts.items-stretch, .sts .items-stretch{align-items:stretch;}
      .sts.gap-2, .sts .gap-2{row-gap:0.5rem;column-gap:0.5rem;}
      .sts.gap-5, .sts .gap-5{row-gap:1.25rem;column-gap:1.25rem;}
      .sts.px-5, .sts .px-5{padding-left:1.25rem;padding-right:1.25rem;}
      .sts.py-16, .sts .py-16{padding-top:4rem;padding-bottom:4rem;}
      .sts.text-3xl, .sts .text-3xl{font-size:1.875rem;line-height:2.25rem;}
      .sts.text-base, .sts .text-base{font-size:1rem;line-height:1.5rem;}
      .sts.text-sm, .sts .text-sm{font-size:0.875rem;line-height:1.25rem;}
      .sts.font-semibold, .sts .font-semibold{font-weight:600;}
      .sts.leading-relaxed, .sts .leading-relaxed{line-height:1.625;}
      @media (min-width: 640px){.sts.sm\:px-8, .sts .sm\:px-8{padding-left:2rem;padding-right:2rem;}}
    }
  </style>

  <div class="sts-wrap mx-auto max-w-4xl">
    <h2 id="sts-title" class="mb-8 text-3xl font-semibold">What people said afterwards</h2>

    <ul class="sts-row grid items-stretch gap-5">
      <li>
        <figure class="sts-card" style="animation-delay:0ms">
          <div class="flex items-center gap-2">
            <span class="sts-stars" aria-hidden="true">
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
            </span>
            <span class="sts-soft text-sm">5 out of 5</span>
          </div>
          <blockquote class="mt-3 text-base leading-relaxed">Twenty minutes to find a leak two other firms had spent a day looking for. The floor went back exactly as it was.</blockquote>
          <figcaption class="sts-attrib">
            <cite class="block text-sm font-semibold">Margaret Ellison</cite>
            <span class="sts-soft block text-sm">West Bridgford, March 2026</span>
          </figcaption>
        </figure>
      </li>

      <li>
        <figure class="sts-card" style="animation-delay:70ms">
          <div class="flex items-center gap-2">
            <span class="sts-stars" aria-hidden="true">
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
            </span>
            <span class="sts-soft text-sm">5 out of 5</span>
          </div>
          <blockquote class="mt-3 text-base leading-relaxed">Quoted on the Tuesday, fitted on the Friday, and the price was the price. My mother has booked them for hers.</blockquote>
          <figcaption class="sts-attrib">
            <cite class="block text-sm font-semibold">Daniel Okoye</cite>
            <span class="sts-soft block text-sm">Sherwood, January 2026</span>
          </figcaption>
        </figure>
      </li>

      <li>
        <figure class="sts-card" style="animation-delay:140ms">
          <div class="flex items-center gap-2">
            <span class="sts-stars" aria-hidden="true">
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
            </span>
            <span class="sts-soft text-sm">5 out of 5</span>
          </div>
          <blockquote class="mt-3 text-base leading-relaxed">They put down sheets before they carried anything in and took every offcut away. You would not know they had been except the heating works.</blockquote>
          <figcaption class="sts-attrib">
            <cite class="block text-sm font-semibold">Priya Raval</cite>
            <span class="sts-soft block text-sm">Beeston, November 2025</span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>
