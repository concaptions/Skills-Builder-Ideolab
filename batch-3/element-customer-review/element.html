<!--
  Customer Review element.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  A real blockquote with a cite, so the words and the person who said them are
  connected rather than merely near each other.

  The rating is written in text as well as drawn. Five shapes on their own are
  silence to a screen reader, so the stars are aria-hidden and the figure
  beside them carries the meaning.

  Replace the words and the names with real ones. An invented review is worse
  than no review.

  Default configuration shown here:
    quote card, avatar shown, five stars with the figure in text, name and
    location, fade in.

  Every class is prefixed erv- so it cannot collide with the rest of the page.
-->
<section class="erv px-5 py-16 sm:px-8" aria-labelledby="erv-title">

  <style>
    
    @layer erv-base {
      .erv,.erv *,.erv *::before,.erv *::after{box-sizing:border-box}
      .erv{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
      .erv h2,.erv p,.erv blockquote,.erv figure{margin:0}
      .erv svg{display:block;max-width:100%}
      .erv{background-color:rgb(var(--erv-surface));color:rgb(var(--erv-ink));padding:4rem 1.25rem}
      .erv .erv-wrap{max-width:40rem;margin-inline:auto}
      .erv h2{font-size:1.875rem;font-weight:600}
      .erv p,.erv blockquote{font-size:1rem;line-height:1.625}
    }

    .erv{
      --erv-surface:255 255 255;
      --erv-band:246 247 249;
      --erv-ink:15 23 42;
      --erv-soft:92 107 129;
      --erv-accent:37 99 235;
      --erv-deep:11 18 32;
      background-color:rgb(var(--erv-surface));
      color:rgb(var(--erv-ink));
    }
    .erv .erv-soft{color:rgb(var(--erv-soft))}

    .erv .erv-card{
      border:1px solid rgb(var(--erv-ink)/.10);border-radius:1.25rem;padding:1.75rem;
      background-color:rgb(var(--erv-band));
      transition:transform 240ms cubic-bezier(.16,1,.3,1),box-shadow 240ms ease;
      animation:erv-fade 420ms cubic-bezier(.16,1,.3,1) both;
    }
    .erv .erv-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgb(15 23 42 / .08)}
    @keyframes erv-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    .erv .erv-stars{color:rgb(var(--erv-accent));display:flex;gap:.15rem}
    .erv .erv-quote{font-size:1.125rem;line-height:1.65}
    .erv .erv-avatar{
      width:3rem;height:3rem;border-radius:9999px;overflow:hidden;flex:none;
      background-color:rgb(var(--erv-accent)/.12);
    }
    .erv cite{font-style:normal}

    @media (prefers-reduced-motion: reduce){
      .erv .erv-card{animation:none;transition:none}
      .erv .erv-card:hover{transform:none;box-shadow:none}
    }
  
    @layer ideolab-fallback {
      /* Taken from Tailwind itself, so it cannot drift from what the
         classes mean. It sits in a layer, so a page that loads its own
         Tailwind overrides all of it; a page with none renders from this. */
      .erv, .erv *, .erv::before, .erv *::before, .erv::after, .erv *::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: ;}
      .erv, .erv *, .erv::after, .erv *::after, .erv::before, .erv *::before{box-sizing:border-box;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;border-top-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-style:solid;border-top-color:rgb(229, 231, 235);border-right-color:rgb(229, 231, 235);border-bottom-color:rgb(229, 231, 235);border-left-color:rgb(229, 231, 235);}
      .erv::after, .erv *::after, .erv::before, .erv *::before{--tw-content:'';}
      .erv{line-height:1.5;text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
      .erv h1, .erv h2, .erv h3, .erv h4, .erv h5, .erv h6{font-size:inherit;font-weight:inherit;}
      .erv blockquote, .erv dd, .erv dl, .erv figure, .erv h1, .erv h2, .erv h3, .erv h4, .erv h5, .erv h6, .erv hr, .erv p, .erv pre{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;}
      .erv audio, .erv canvas, .erv embed, .erv iframe, .erv img, .erv object, .erv svg, .erv video{display:block;vertical-align:middle;}
      .erv.mx-auto, .erv .mx-auto{margin-left:auto;margin-right:auto;}
      .erv.mb-6, .erv .mb-6{margin-bottom:1.5rem;}
      .erv.mt-4, .erv .mt-4{margin-top:1rem;}
      .erv.mt-5, .erv .mt-5{margin-top:1.25rem;}
      .erv.block, .erv .block{display:block;}
      .erv.flex, .erv .flex{display:flex;}
      .erv.h-4, .erv .h-4{height:1rem;}
      .erv.w-4, .erv .w-4{width:1rem;}
      .erv.max-w-xl, .erv .max-w-xl{max-width:36rem;}
      .erv.items-center, .erv .items-center{align-items:center;}
      .erv.gap-2, .erv .gap-2{row-gap:0.5rem;column-gap:0.5rem;}
      .erv.gap-3, .erv .gap-3{row-gap:0.75rem;column-gap:0.75rem;}
      .erv.fill-muted, .erv .fill-muted{fill:rgb(246, 247, 249);}
      .erv.px-5, .erv .px-5{padding-left:1.25rem;padding-right:1.25rem;}
      .erv.py-16, .erv .py-16{padding-top:4rem;padding-bottom:4rem;}
      .erv.text-3xl, .erv .text-3xl{font-size:1.875rem;line-height:2.25rem;}
      .erv.text-sm, .erv .text-sm{font-size:0.875rem;line-height:1.25rem;}
      .erv.font-semibold, .erv .font-semibold{font-weight:600;}
      @media (min-width: 640px){.erv.sm\:px-8, .erv .sm\:px-8{padding-left:2rem;padding-right:2rem;}}
    }
  </style>

  <div class="erv-wrap mx-auto max-w-xl">
    <h2 id="erv-title" class="mb-6 text-3xl font-semibold">What people say afterwards</h2>

    <figure class="erv-card">
      <div class="flex items-center gap-2">
        <span class="erv-stars" aria-hidden="true">
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
          <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="m10 2 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></svg>
        </span>
        <span class="erv-soft text-sm">Rated 5 out of 5</span>
      </div>

      <blockquote class="erv-quote mt-4">They found the leak in twenty minutes after two other firms had spent a day looking. The floor went back exactly as it was, and the price was the one on the quote.</blockquote>

      <figcaption class="mt-5 flex items-center gap-3">
        <span class="erv-avatar" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48">
            <rect width="48" height="48" fill="#e8eefc" class="fill-muted"/>
            <circle cx="24" cy="19" r="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
            <path d="M10 42c2-8 8-11 14-11s12 3 14 11" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span>
          <cite class="block text-sm font-semibold">Margaret Ellison</cite>
          <span class="erv-soft block text-sm">West Bridgford, March 2026</span>
        </span>
      </figcaption>
    </figure>
  </div>
</section>
