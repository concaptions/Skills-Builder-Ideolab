<!--
  Single Image element.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  The placeholder is inline SVG rather than a file, so the block makes no
  external request. Replace it with the customer's own photograph.

  The aspect ratio is set on the frame, not on the picture, so swapping the
  image cannot move the layout. The zoom happens inside the frame, so nothing
  around it is pushed.

  Default configuration shown here:
    4 by 3, rounded, caption shown, slow zoom on hover.

  Every class is prefixed eim- so it cannot collide with the rest of the page.
-->
<section class="eim px-5 py-14 sm:px-8">

  <style>
    
    @layer eim-base {
      .eim,.eim *,.eim *::before,.eim *::after{box-sizing:border-box}
      .eim{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
      .eim h2,.eim p,.eim figure,.eim figcaption{margin:0}
      .eim img,.eim svg{display:block;max-width:100%}
      .eim{background-color:rgb(var(--eim-surface));color:rgb(var(--eim-ink));padding:3.5rem 1.25rem}
      .eim .eim-wrap{max-width:44rem;margin-inline:auto}
      .eim p,.eim figcaption{font-size:.9375rem;line-height:1.6}
    }

    .eim{
      --eim-surface:255 255 255;
      --eim-band:246 247 249;
      --eim-ink:15 23 42;
      --eim-soft:92 107 129;
      --eim-accent:37 99 235;
      --eim-deep:11 18 32;
      background-color:rgb(var(--eim-surface));
      color:rgb(var(--eim-ink));
    }
    .eim .eim-soft{color:rgb(var(--eim-soft))}

    /* The ratio lives on the frame. Swapping the picture cannot move the page. */
    .eim .eim-frame{
      overflow:hidden;border-radius:1.25rem;aspect-ratio:4 / 3;
      background-color:rgb(var(--eim-band));
    }
    .eim .eim-frame > *{width:100%;height:100%;object-fit:cover;
      transition:transform 500ms cubic-bezier(.16,1,.3,1)}
    .eim .eim-frame:hover > *{transform:scale(1.04)}

    @media (max-width: 639px){
      .eim .eim-frame{aspect-ratio:3 / 4}
    }

    @media (prefers-reduced-motion: reduce){
      .eim .eim-frame > *{transition:none}
      .eim .eim-frame:hover > *{transform:none}
    }
  
    @layer ideolab-fallback {
      /* Taken from Tailwind itself, so it cannot drift from what the
         classes mean. It sits in a layer, so a page that loads its own
         Tailwind overrides all of it; a page with none renders from this. */
      .eim, .eim *, .eim::before, .eim *::before, .eim::after, .eim *::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: ;}
      .eim, .eim *, .eim::after, .eim *::after, .eim::before, .eim *::before{box-sizing:border-box;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;border-top-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-style:solid;border-top-color:rgb(229, 231, 235);border-right-color:rgb(229, 231, 235);border-bottom-color:rgb(229, 231, 235);border-left-color:rgb(229, 231, 235);}
      .eim::after, .eim *::after, .eim::before, .eim *::before{--tw-content:'';}
      .eim{line-height:1.5;text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
      .eim blockquote, .eim dd, .eim dl, .eim figure, .eim h1, .eim h2, .eim h3, .eim h4, .eim h5, .eim h6, .eim hr, .eim p, .eim pre{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;}
      .eim audio, .eim canvas, .eim embed, .eim iframe, .eim img, .eim object, .eim svg, .eim video{display:block;vertical-align:middle;}
      .eim.mx-auto, .eim .mx-auto{margin-left:auto;margin-right:auto;}
      .eim.mt-3, .eim .mt-3{margin-top:0.75rem;}
      .eim.max-w-2xl, .eim .max-w-2xl{max-width:42rem;}
      .eim.fill-muted, .eim .fill-muted{fill:rgb(246, 247, 249);}
      .eim.px-5, .eim .px-5{padding-left:1.25rem;padding-right:1.25rem;}
      .eim.py-14, .eim .py-14{padding-top:3.5rem;padding-bottom:3.5rem;}
      .eim.text-sm, .eim .text-sm{font-size:0.875rem;line-height:1.25rem;}
      .eim.leading-relaxed, .eim .leading-relaxed{line-height:1.625;}
      @media (min-width: 640px){.eim.sm\:px-8, .eim .sm\:px-8{padding-left:2rem;padding-right:2rem;}}
    }
  </style>

  <figure class="eim-wrap mx-auto max-w-2xl">
    <div class="eim-frame">
      <svg viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A finished bathroom with a walk in shower and a tiled floor">
        <rect width="800" height="600" fill="#f6f7f9" class="fill-muted"/>
        <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
          <path d="M120 470h560" fill="none"/>
          <path d="M180 470V250h180v220" fill="none"/>
          <path d="M180 300h180" fill="none"/>
          <path d="M430 470V330h190v140" fill="none"/>
          <circle cx="270" cy="215" r="26" fill="none"/>
          <path d="M470 300h110" fill="none"/>
        </g>
      </svg>
    </div>
    <figcaption class="eim-soft mt-3 text-sm leading-relaxed">A full bathroom fit in Nottingham, stripped back and rebuilt by one team in eight working days.</figcaption>
  </figure>
</section>
