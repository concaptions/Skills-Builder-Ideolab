<!--
  Single Icon element.
  Static block. HTML + Tailwind utility classes + a small scoped stylesheet.
  No JavaScript, no external assets, no build step.

  Inline SVG, never an icon font. Every path carries a presentation attribute
  as well as a class, so it keeps its colour where the stylesheet has not
  loaded, and every stroke only path carries fill="none", because a path with
  no fill is filled solid black.

  The decorative marks are aria-hidden. The one inside a link has a real
  accessible name, because a link announced as blank is a dead end.

  Default configuration shown here:
    line style, circle container, accent stroke, draw on entrance.

  Every class is prefixed eic- so it cannot collide with the rest of the page.
-->
<section class="eic px-5 py-14 sm:px-8">

  <style>
    
    @layer eic-base {
      .eic,.eic *,.eic *::before,.eic *::after{box-sizing:border-box}
      .eic{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
      .eic h2,.eic h3,.eic p{margin:0}
      .eic ul,.eic ol{margin:0;padding:0;list-style:none}
      .eic img,.eic svg{display:block;max-width:100%}
      .eic{background-color:rgb(var(--eic-surface));color:rgb(var(--eic-ink));padding:3.5rem 1.25rem}
      .eic .eic-wrap{max-width:40rem;margin-inline:auto}
      .eic .eic-row{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center}
      .eic p{font-size:1rem;line-height:1.6}
    }

    .eic{
      --eic-surface:255 255 255;
      --eic-band:246 247 249;
      --eic-ink:15 23 42;
      --eic-soft:92 107 129;
      --eic-accent:37 99 235;
      --eic-deep:11 18 32;
      background-color:rgb(var(--eic-surface));
      color:rgb(var(--eic-ink));
    }
    .eic .eic-soft{color:rgb(var(--eic-soft))}

    /* The container scales with the type beside it rather than being fixed. */
    .eic .eic-tile{
      display:grid;place-items:center;width:2.75em;height:2.75em;border-radius:9999px;
      background-color:rgb(var(--eic-accent)/.10);
    }
    .eic .eic-tile svg{width:1.35em;height:1.35em}
    .eic .eic-square{border-radius:.85rem}

    .eic .eic-draw path,.eic .eic-draw circle{
      stroke-dasharray:64;stroke-dashoffset:64;
      animation:eic-draw 620ms cubic-bezier(.16,1,.3,1) forwards;
    }
    @keyframes eic-draw{to{stroke-dashoffset:0}}

    /* A tappable icon keeps a 44px target even when the mark is smaller. */
    .eic .eic-link{display:inline-grid;place-items:center;min-width:2.75rem;min-height:2.75rem;border-radius:9999px}
    .eic .eic-link:hover,.eic .eic-link:focus-visible{background-color:rgb(var(--eic-accent)/.10)}
    .eic .eic-link:focus-visible{outline:2px solid rgb(var(--eic-accent));outline-offset:2px}

    @media (prefers-reduced-motion: reduce){
      .eic .eic-draw path,.eic .eic-draw circle{animation:none;stroke-dashoffset:0}
    }
  </style>

  <div class="eic-wrap mx-auto max-w-xl">
    <div class="eic-row flex flex-wrap items-center gap-6">

      <span class="eic-tile eic-draw" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4 8v8l8 5 8-5V8z" fill="none"/>
          <path d="M12 12v9" fill="none"/>
        </svg>
      </span>

      <span class="eic-tile eic-square eic-draw" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8" fill="none"/>
          <path d="M12 8v4l3 2" fill="none"/>
        </svg>
      </span>

      <a href="#warranty" class="eic-link">
        <span class="sr-only">Read about the warranty</span>
        <svg width="24" height="24" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z" fill="none"/>
          <path d="m9 12 2 2 4-4" fill="none"/>
        </svg>
      </a>

      <p class="eic-soft text-sm leading-relaxed">The first two marks are decorative and are passed over by a screen reader. The third is a link and carries its own name.</p>
    </div>
  </div>

  <style>
    .eic .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  
    @layer ideolab-fallback {
      /* Taken from Tailwind itself, so it cannot drift from what the
         classes mean. It sits in a layer, so a page that loads its own
         Tailwind overrides all of it; a page with none renders from this. */
      .eic, .eic *, .eic::before, .eic *::before, .eic::after, .eic *::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: ;}
      .eic, .eic *, .eic::after, .eic *::after, .eic::before, .eic *::before{box-sizing:border-box;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;border-top-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-style:solid;border-top-color:rgb(229, 231, 235);border-right-color:rgb(229, 231, 235);border-bottom-color:rgb(229, 231, 235);border-left-color:rgb(229, 231, 235);}
      .eic::after, .eic *::after, .eic::before, .eic *::before{--tw-content:'';}
      .eic{line-height:1.5;text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent;}
      .eic a{color:inherit;text-decoration-line:inherit;text-decoration-thickness:inherit;text-decoration-style:inherit;text-decoration-color:inherit;}
      .eic blockquote, .eic dd, .eic dl, .eic figure, .eic h1, .eic h2, .eic h3, .eic h4, .eic h5, .eic h6, .eic hr, .eic p, .eic pre{margin-top:0px;margin-right:0px;margin-bottom:0px;margin-left:0px;}
      .eic audio, .eic canvas, .eic embed, .eic iframe, .eic img, .eic object, .eic svg, .eic video{display:block;vertical-align:middle;}
      .eic.sr-only, .eic .sr-only{position:absolute;width:1px;height:1px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px;margin-top:-1px;margin-right:-1px;margin-bottom:-1px;margin-left:-1px;overflow-x:hidden;overflow-y:hidden;clip:rect(0px, 0px, 0px, 0px);white-space-collapse:collapse;text-wrap-mode:nowrap;border-top-width:0px;border-right-width:0px;border-bottom-width:0px;border-left-width:0px;}
      .eic.mx-auto, .eic .mx-auto{margin-left:auto;margin-right:auto;}
      .eic.flex, .eic .flex{display:flex;}
      .eic.h-6, .eic .h-6{height:1.5rem;}
      .eic.w-6, .eic .w-6{width:1.5rem;}
      .eic.max-w-xl, .eic .max-w-xl{max-width:36rem;}
      .eic.flex-wrap, .eic .flex-wrap{flex-wrap:wrap;}
      .eic.items-center, .eic .items-center{align-items:center;}
      .eic.gap-6, .eic .gap-6{row-gap:1.5rem;column-gap:1.5rem;}
      .eic.px-5, .eic .px-5{padding-left:1.25rem;padding-right:1.25rem;}
      .eic.py-14, .eic .py-14{padding-top:3.5rem;padding-bottom:3.5rem;}
      .eic.text-sm, .eic .text-sm{font-size:0.875rem;line-height:1.25rem;}
      .eic.leading-relaxed, .eic .leading-relaxed{line-height:1.625;}
      @media (min-width: 640px){.eic.sm\:px-8, .eic .sm\:px-8{padding-left:2rem;padding-right:2rem;}}
    }
  </style>
</section>
